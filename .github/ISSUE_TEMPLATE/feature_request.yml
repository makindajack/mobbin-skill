name: Feature request
description: Suggest an improvement to the skill, references, or examples.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-facing problem does this solve? Who hits it and when?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd like to add or change. File names + a sketch of the new content are ideal.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one is better.
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Example prompts (optional)
      description: If this is a new query pattern or template, paste 1–3 example prompts that should work better after the change.
      render: text
    validations:
      required: false
