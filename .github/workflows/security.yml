name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # weekly Monday 06:00 UTC — catches drift from new gitleaks rules
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (validate.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
