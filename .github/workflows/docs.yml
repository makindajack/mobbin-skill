name: docs

on:
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
      - ".markdownlint.jsonc"
      - "lychee.toml"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    # weekly link check — catches dead Mobbin / vendor URLs
    - cron: "0 7 * * 1"

permissions:
  contents: read
  issues: write # lychee can open an issue when links break on schedule

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !node_modules
            !clients/copilot/mobbin.prompt.md

  lychee:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --exclude-path node_modules
            --exclude-path clients/copilot/mobbin.prompt.md
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
